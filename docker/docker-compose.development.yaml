name: python-fastapi

networks:
  microservices:
    driver: bridge

services:
  api:
    container_name: fastapi-product-api
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env.development
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  payment:
    container_name: fastapi-payment-service
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["uvicorn", "app.payment.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../.env.development
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PORT=8001
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    container_name: fastapi-redis
    image: redis:8-alpine
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ../.env.development
    volumes:
      - redis_data:/data
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
